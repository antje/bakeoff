<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- bakeoff icon: a bold B with a bite taken out, pixels scattering off the edge.
       Recolor by editing the three values below (or override the CSS variables bg, fg, edge). -->
  <style>
    :root { --bg: #F0B429; --fg: #0B0C0F; --edge: #0B0C0F; }
    .bg   { fill: var(--bg,   #F0B429); }
    .fg   { fill: var(--fg,   #0B0C0F); }
    .edge { fill: var(--edge, #0B0C0F); }
  </style>

  <!-- rounded tile with a thin border -->
  <rect class="edge" x="0" y="0" width="512" height="512" rx="112"/>
  <rect class="bg" x="20" y="20" width="472" height="472" rx="96"/>

  <!-- bite: a circle plus two smaller scallops, cut from the B -->
  <mask id="bite">
    <rect width="512" height="512" fill="#fff"/>
    <circle cx="142" cy="104" r="50" fill="#000"/>
    <circle cx="192" cy="120" r="11" fill="#000"/>
    <circle cx="138" cy="156" r="11" fill="#000"/>
  </mask>

  <!-- the B: outer shape minus two counters (evenodd) -->
  <path class="fg" mask="url(#bite)" fill-rule="evenodd" d="
    M130 110 H300 A70 70 0 0 1 300 250 A80 80 0 0 1 300 410 H130 Z
    M175 155 H300 A25 25 0 0 1 300 205 H175 Z
    M175 295 H300 A35 35 0 0 1 300 365 H175 Z"/>

  <!-- crumbs: pixels drifting away from the bite -->
  <g class="fg">
    <rect x="112" y="30" width="18" height="18"/>
    <rect x="90"  y="52" width="18" height="18"/>
    <rect x="134" y="52" width="18" height="18"/>
    <rect x="68"  y="74" width="18" height="18"/>
    <rect x="112" y="74" width="18" height="18"/>
    <rect x="90"  y="96" width="18" height="18"/>
  </g>
</svg>
