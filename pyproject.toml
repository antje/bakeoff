[project]
name = "bakeoff"
version = "0.1.0"
description = "A bake-off for your agent: build an eval from your own workload, run it against any model on OpenRouter, decide by cost per correct call."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Antje Barth" }]
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.9"]
dev = ["ruff>=0.8", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
