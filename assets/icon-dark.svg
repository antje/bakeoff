<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- bakeoff mark, monochrome: the B in one ink, only the crumbs carry the accent. -->
  <style>
    .ink   { fill: var(--ink,   #F3EFE6); }
    .crumb { fill: var(--crumb, #F0B429); }
  </style>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0B0C0F"/>
  <mask id="bite">
    <rect width="512" height="512" fill="#fff"/>
    <circle cx="142" cy="104" r="50" fill="#000"/>
    <circle cx="192" cy="120" r="11" fill="#000"/>
    <circle cx="138" cy="156" r="11" fill="#000"/>
  </mask>
  <path class="ink" mask="url(#bite)" fill-rule="evenodd" d="
    M130 110 H300 A70 70 0 0 1 300 250 A80 80 0 0 1 300 410 H130 Z
    M175 155 H300 A25 25 0 0 1 300 205 H175 Z
    M175 295 H300 A35 35 0 0 1 300 365 H175 Z"/>
  <g class="crumb">
    <rect x="112" y="30" width="18" height="18"/>
    <rect x="90"  y="52" width="18" height="18"/>
    <rect x="134" y="52" width="18" height="18"/>
    <rect x="68"  y="74" width="18" height="18"/>
    <rect x="112" y="74" width="18" height="18"/>
    <rect x="90"  y="96" width="18" height="18"/>
  </g>
</svg>
